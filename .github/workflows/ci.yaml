name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new RustSec advisories are caught even when the code doesn't change.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so new releases can't break CI unexpectedly. Bump deliberately.
  # Nightly is required: rustfmt.toml uses nightly-only options.
  RUST_NIGHTLY: nightly-2026-09-21
  # Matches the rust image in the Dockerfile.
  RUST_STABLE: '1.99'

jobs:
  graphql-schema:
    name: GraphQL schema and release notes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_STABLE" --profile minimal
          rustup default "$RUST_STABLE"
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install GraphQL Inspector
        run: npm install --global @graphql-inspector/cli@7.0.2 graphql@16.11.0
      - name: Select master baseline
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == pull_request && "$BASE_BRANCH" == master ]]; then
            baseline="$BASE_SHA"
          elif [[ "$EVENT_NAME" == push ]]; then
            baseline="$BEFORE_SHA"
          else
            git fetch origin master
            baseline=$(git rev-parse FETCH_HEAD)
          fi
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"
      - name: Check snapshot and generate schema release notes
        env:
          BASELINE: ${{ steps.baseline.outputs.sha }}
        run: bash scripts/check-graphql-schema-ci.sh "$BASELINE" "$RUNNER_TEMP/graphql-schema-changes.md"
      - name: Show schema release notes
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "$RUNNER_TEMP/graphql-schema-changes.md" ]]; then
            cat "$RUNNER_TEMP/graphql-schema-changes.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: graphql-schema-release-notes
          path: ${{ runner.temp }}/graphql-schema-changes.md
          if-no-files-found: ignore

  fmt:
    name: rustfmt
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly rustfmt
        run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo "+$RUST_NIGHTLY" fmt --all --check

  clippy:
    name: clippy (${{ matrix.product }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        product: [platform, ppp]
    steps:
      - uses: actions/checkout@v7
      - name: Install stable clippy
        run: |
          rustup toolchain install "$RUST_STABLE" --profile minimal --component clippy
          rustup default "$RUST_STABLE"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.product }}
      - name: Run clippy
        run: cargo clippy --locked --all-targets --features product-${{ matrix.product }} -- -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Scans the Docker image's OS packages for CVEs. cargo-deny covers the Rust
  # dependencies. Runs on the weekly schedule too, since base-image CVEs appear
  # without any code change.
  trivy:
    name: trivy (image)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@v7

      # Scan the runtime base image (the last FROM in the Dockerfile) instead of
      # building ours. Our image is that base plus the Rust binary, which adds no
      # OS packages, so the result is the same without a slow cargo build.
      # If the final stage ever installs packages, go back to building the image.
      # build-images.yaml also scans the real image before each release.
      - name: Find runtime base image
        run: |
          IMAGE=$(grep -E '^FROM ' Dockerfile | tail -1 | awk '{print $2}')
          echo "Scanning ${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      # Report everything HIGH/CRITICAL, including CVEs with no fix yet.
      - name: Scan image (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true

      # Fork PRs get a read-only token, so they can't upload.
      - name: Upload results to Security tab
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Fail only on CVEs that have a fix, since those are the ones we can act on
      # (usually by rebuilding on a newer base image). Accepted findings go in .trivyignore.
      - name: Scan image (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
