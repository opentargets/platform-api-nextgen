name: build-release

# Runs when `cargo release` (via `just rc` / `just release`) pushes a v* tag.
# Verifies the tag, creates the GitHub Release (a pre-release for -rc.N),
# adds the GraphQL schema notes and builds the images.
on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        name: Tag matches Cargo.toml and is on main
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE=$(cargo pkgid | sed 's/.*[#@]//')
          if [ "$TAG" != "$CRATE" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CRATE. Tags must be created by cargo release."
            exit 1
          fi
          if [[ "$TAG" == *-dev* ]]; then
            echo "::error::$GITHUB_REF_NAME is a -dev version; only RCs and releases are tagged. Use the build-dev workflow for dev images."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Releases are only cut from main."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${args[@]}"

  schema-notes:
    name: Generate release schema notes
    needs: release
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/graphql-inspector/package-lock.json
      - name: Install GraphQL Inspector
        run: |
          npm ci --prefix tools/graphql-inspector --prefer-offline --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/tools/graphql-inspector/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Select previous published release
        id: previous
        uses: actions/github-script@v9
        with:
          script: |
            const { data: current } = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag: context.ref.replace('refs/tags/', ''),
            });
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const previous = releases
              .filter(release => !release.draft && release.id !== current.id &&
                (current.prerelease || !release.prerelease) &&
                Date.parse(release.published_at) < Date.parse(current.published_at))
              .sort((a, b) => Date.parse(b.published_at) - Date.parse(a.published_at))[0];
            core.setOutput('tag', previous ? previous.tag_name : '');
      - name: Generate schema release notes
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          if [[ -z "$PREVIOUS_TAG" ]]; then
            printf '# GraphQL schema changes\n\nInitial release: no previous published release is available for comparison.\n' > "$RUNNER_TEMP/graphql-schema-changes.md"
          else
            bash scripts/release-schema-notes.sh "$PREVIOUS_TAG" "$CURRENT_TAG" "$RUNNER_TEMP/graphql-schema-changes.md"
          fi
          cat "$RUNNER_TEMP/graphql-schema-changes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Add schema notes to release description
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const notes = fs.readFileSync(`${process.env.RUNNER_TEMP}/graphql-schema-changes.md`, 'utf8').trim();
            const start = '<!-- graphql-schema-notes:start -->';
            const end = '<!-- graphql-schema-notes:end -->';
            const section = `${start}\n${notes}\n${end}`;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag: context.ref.replace('refs/tags/', ''),
            });
            const params = { ...context.repo, release_id: release.id };
            const original = release.body || '';
            const first = original.indexOf(start), last = original.indexOf(end);
            let body;
            if (first === -1 && last === -1) {
              body = original + (original ? '\n\n' : '') + section;
            } else if (first >= 0 && last > first &&
                       original.indexOf(start, first + start.length) === -1 &&
                       original.indexOf(end, last + end.length) === -1) {
              body = original.slice(0, first) + section + original.slice(last + end.length);
            } else {
              core.warning('Release description contains incomplete or duplicate schema markers; description preserved.');
              return;
            }
            if (body !== original) await github.rest.repos.updateRelease({ ...params, body });
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: graphql-schema-release-notes
          path: ${{ runner.temp }}/graphql-schema-changes.md
          if-no-files-found: ignore

  build:
    name: Build release images
    needs: verify
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/build-images.yaml
    with:
      version: ${{ needs.verify.outputs.version }}
      # Only full releases move `latest`; release candidates get the version tag only.
      latest: ${{ needs.verify.outputs.prerelease != 'true' }}
