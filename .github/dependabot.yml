version: 2
updates:
  # Keeps the `uses:` refs in .github/workflows up to date, including
  # exact version pins like trivy-action@v0.36.0.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One PR per week for all action bumps, instead of one per action.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
