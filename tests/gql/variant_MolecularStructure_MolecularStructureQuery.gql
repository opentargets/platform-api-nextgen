# The following fields were removed, because their resolvers read a
# table the integration tests do not seed:
#   - proteinCodingCoordinates
# The original document is packages/sections/src/variant/MolecularStructure/MolecularStructureQuery.gql.
query MolecularStructureQuery($variantId: String!) {
  variant(variantId: $variantId) {
    referenceAllele
    alternateAllele
  }
}
