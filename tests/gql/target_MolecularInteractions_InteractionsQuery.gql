# The following fields were removed, because their resolvers read a
# table the integration tests do not seed:
#   - interactions
# The original document is packages/sections/src/target/MolecularInteractions/InteractionsQuery.gql.
query TargetInteractionsQuery(
  $ensgId: String! ) {
  target(ensemblId: $ensgId) {
    id
    approvedName
    approvedSymbol

  }
}
