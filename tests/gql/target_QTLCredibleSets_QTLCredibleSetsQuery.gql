# The following fields were removed, because their resolvers read a
# table the integration tests do not seed:
#   - credibleSets
# The original document is packages/sections/src/target/QTLCredibleSets/QTLCredibleSetsQuery.gql.
query TargetQTLCredibleSetsQuery(
  $ensemblId: String! ) {
  target(ensemblId: $ensemblId) {
    id
    approvedSymbol
  }
}
