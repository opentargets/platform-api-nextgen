# The following fields were removed, because their resolvers read a
# table the integration tests do not seed:
#   - mechanismsOfAction
# The original document is packages/sections/src/drug/MechanismsOfAction/MechanismsOfActionQuery.gql.
query MechanismsOfActionSectionQuery($chemblId: String!) {
  drug(chemblId: $chemblId) {
    id
    parentMolecule {
      id
      name
    }
    childMolecules {
      id
      name
    }
  }
}
