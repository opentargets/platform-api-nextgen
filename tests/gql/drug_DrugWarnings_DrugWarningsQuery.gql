# The following fields were removed, because their resolvers read a
# table the integration tests do not seed:
#   - drugWarnings
# The original document is packages/sections/src/drug/DrugWarnings/DrugWarningsQuery.gql.
query DrugWarningsQuery(
  $chemblId: String! ) {
  drug(chemblId: $chemblId) {
    id
  }
}
