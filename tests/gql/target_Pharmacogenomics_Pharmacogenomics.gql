# The following fields were removed, because their resolvers read a
# table the integration tests do not seed:
#   - pharmacogenomics
# The original document is packages/sections/src/target/Pharmacogenomics/Pharmacogenomics.gql.
query TargetPharmacogenomicsQuery(
  $ensemblId: String! ) {
  target(ensemblId: $ensemblId) {
    id
  }
}
