# The following fields were removed, because their resolvers read a
# table the integration tests do not seed:
#   - literatureOcurrences
#   - similarEntities
# The original document is packages/sections/src/drug/Bibliography/BibliographyQuery.gql.
query DrugBibliographyQuery(
  $id: String! ) {
  drug(chemblId: $id) {
    id
    name
  }
}
