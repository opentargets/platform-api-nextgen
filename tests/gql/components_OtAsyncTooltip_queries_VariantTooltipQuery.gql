# The following fields were removed, because their resolvers read a
# table the integration tests do not seed:
#   - mostSevereConsequence
# The original document is packages/ui/src/components/OtAsyncTooltip/queries/VariantTooltipQuery.gql.
query VariantTooltipQuery($variantId: String!) {
  variant(variantId: $variantId) {
    id: variantId
    description: variantDescription
  }
}
