# The following fields were removed, because their resolvers read a
# table the integration tests do not seed:
#   - depMapEssentiality
# The original document is packages/sections/src/target/DepMap/Depmap.gql.
query TargetDepMapQuery($ensemblId: String!) {
  target(ensemblId: $ensemblId) {
    id
  }
}
