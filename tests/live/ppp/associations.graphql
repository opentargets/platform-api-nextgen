# variables: {"target": "ENSG99999999999", "disease": "EFO_9999999"}
query LiveAssociations($target: String!, $disease: String!) {
  associationDatasources {
    datasource
    datatype
  }
  target(ensemblId: $target) {
    id
    associatedDiseases {
      count
      rows {
        score
        datasourceScores {
          id
          score
        }
        novelty
        disease {
          id
        }
      }
    }
    associatedDiseases_Bs: associatedDiseases(Bs: [$disease]) {
      count
      rows {
        score
        novelty
      }
    }
    associatedDiseases_BFilter: associatedDiseases(BFilter: "a") {
      count
      rows {
        score
        novelty
      }
    }
    associatedDiseases_includeMeasurements: associatedDiseases(includeMeasurements: true) {
      count
      rows {
        score
        novelty
      }
    }
    associatedDiseases_indirectWeight: associatedDiseases(indirectWeight: 0.5) {
      count
      rows {
        score
        novelty
      }
    }
    associatedDiseases_datasourcePolicyOverrides: associatedDiseases(datasourcePolicyOverrides: [{id: clinical_precedence, policy: {weight: 0.5, required: true, propagate: true}}]) {
      count
      rows {
        score
        novelty
      }
    }
    associatedDiseases_sort: associatedDiseases(sort: {key: "eva", direction: ASCENDING}) {
      count
      rows {
        score
        novelty
      }
    }
    associationTimeSeries(efoId: $disease, isDirect: true) {
      count
      rows {
        diseaseId
        targetId
        aggregationType
        aggregationValue
        isDirect
        year
        associationScore
        novelty
        yearlyEvidenceCount
      }
    }
    associationTimeSeries_aggregationTypes: associationTimeSeries(efoId: $disease, isDirect: true, aggregationTypes: [overall, datasourceId]) {
      count
      rows {
        diseaseId
        targetId
        aggregationType
        aggregationValue
        isDirect
        year
        associationScore
        novelty
        yearlyEvidenceCount
      }
    }
    associationTimeSeries_startYear: associationTimeSeries(efoId: $disease, isDirect: true, startYear: 1) {
      count
      rows {
        diseaseId
        targetId
        aggregationType
        aggregationValue
        isDirect
        year
        associationScore
        novelty
        yearlyEvidenceCount
      }
    }
    associationTimeSeries_endYear: associationTimeSeries(efoId: $disease, isDirect: true, endYear: 1) {
      count
      rows {
        diseaseId
        targetId
        aggregationType
        aggregationValue
        isDirect
        year
        associationScore
        novelty
        yearlyEvidenceCount
      }
    }
  }
  disease(efoId: $disease) {
    id
    associatedTargets {
      count
      rows {
        score
        datasourceScores {
          id
          score
        }
        novelty
        target {
          id
        }
      }
    }
    associatedTargets_Bs: associatedTargets(Bs: [$disease]) {
      count
      rows {
        score
        novelty
      }
    }
    associatedTargets_BFilter: associatedTargets(BFilter: "a") {
      count
      rows {
        score
        novelty
      }
    }
    associatedTargets_indirectWeight: associatedTargets(indirectWeight: 0.5) {
      count
      rows {
        score
        novelty
      }
    }
    associatedTargets_datasourcePolicyOverrides: associatedTargets(datasourcePolicyOverrides: [{id: clinical_precedence, policy: {weight: 0.5, required: true, propagate: true}}]) {
      count
      rows {
        score
        novelty
      }
    }
    associatedTargets_sort: associatedTargets(sort: {key: "eva", direction: ASCENDING}) {
      count
      rows {
        score
        novelty
      }
    }
    associationTimeSeries(ensemblId: $target, isDirect: true) {
      count
      rows {
        diseaseId
        targetId
        aggregationType
        aggregationValue
        isDirect
        year
        associationScore
        novelty
        yearlyEvidenceCount
      }
    }
    associationTimeSeries_aggregationTypes: associationTimeSeries(ensemblId: $target, isDirect: true, aggregationTypes: [overall, datasourceId]) {
      count
      rows {
        diseaseId
        targetId
        aggregationType
        aggregationValue
        isDirect
        year
        associationScore
        novelty
        yearlyEvidenceCount
      }
    }
    associationTimeSeries_startYear: associationTimeSeries(ensemblId: $target, isDirect: true, startYear: 1) {
      count
      rows {
        diseaseId
        targetId
        aggregationType
        aggregationValue
        isDirect
        year
        associationScore
        novelty
        yearlyEvidenceCount
      }
    }
    associationTimeSeries_endYear: associationTimeSeries(ensemblId: $target, isDirect: true, endYear: 1) {
      count
      rows {
        diseaseId
        targetId
        aggregationType
        aggregationValue
        isDirect
        year
        associationScore
        novelty
        yearlyEvidenceCount
      }
    }
  }
}
